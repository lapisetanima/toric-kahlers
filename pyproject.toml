[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extremal"
version = "0.1.0"
description = "Toric Kähler geometry on Delzant polygons: exact invariants, metrics, curvature."
requires-python = ">=3.12"
dependencies = ["numpy", "sympy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "nbformat", "nbclient"]
fast = ["python-flint"]  # rigorous root isolation for crease_exact (falls back to sympy without it)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
